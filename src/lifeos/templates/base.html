<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LifeOS{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f7fb; color: #172033; }
    body { margin: 0; }
    header { background: #172033; color: white; padding: 1rem max(1rem, calc((100vw - 980px) / 2)); display: flex; gap: 1rem; align-items: center; justify-content: space-between; }
    header a { color: white; text-decoration: none; font-weight: 700; }
    nav { display: flex; gap: 1rem; align-items: center; }
    main { max-width: 980px; margin: 0 auto; padding: 1.25rem; }
    h1 { margin-top: 0; }
    a:focus-visible, button:focus-visible { outline: 3px solid #0b63ce; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .source-page { max-width: 72ch; padding: 2.5rem 0 3rem; font-size: 1.0625rem; line-height: 1.65; }
    .source-context { display: block; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid #dbe1ea; }
    .breadcrumbs { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .75rem; padding: 0; color: #526174; font-size: .9rem; list-style: none; }
    .breadcrumbs li + li::before { content: "/"; margin-right: .35rem; color: #687386; }
    .source-context a, .markdown-body a { color: #1d4ed8; text-decoration: underline; text-underline-offset: .12em; }
    .source-label { display: inline-block; margin: 0 0 .75rem; color: #526174; font-size: .9rem; font-weight: 700; letter-spacing: .01em; }
    .source-path-row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
    .source-path { min-width: 0; overflow-wrap: anywhere; padding: .35rem .5rem; border-radius: .3rem; background: #f1f5f9; color: #172033; font-size: .875em; user-select: all; }
    .copy-path { min-height: 44px; background: #2f5bea; }
    .markdown-body { overflow-wrap: break-word; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { font-weight: 700; scroll-margin-top: 1rem; }
    .markdown-body h1 { margin: 0; font-size: 2rem; line-height: 1.2; }
    .markdown-body h2 { margin: 2.5rem 0 1rem; font-size: 1.5rem; line-height: 1.3; }
    .markdown-body h3 { margin: 1.75rem 0 .85rem; font-size: 1.25rem; line-height: 1.35; }
    .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.5rem 0 .75rem; font-size: 1.125rem; line-height: 1.4; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin: 1rem 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.4rem; }
    .markdown-body li + li { margin-top: .4rem; }
    .markdown-body code { padding: .1rem .25rem; border-radius: .25rem; background: #f1f5f9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875em; }
    .markdown-body pre { overflow-x: auto; margin: 1.25rem 0; padding: 1rem; border: 1px solid #dbe1ea; border-radius: .75rem; background: #f1f5f9; }
    .markdown-body pre code { padding: 0; background: transparent; font-size: .875rem; }
    .wiki-link-diagnostic { display: inline; color: #9a3412; border-bottom: 1px dotted currentColor; background: #fff7ed; }
    .card { background: white; border: 1px solid #dbe1ea; border-radius: .75rem; padding: 1rem; margin: 1rem 0; box-shadow: 0 2px 8px #1720330d; }
    form.inline { display: inline; }
    label { display: block; font-weight: 650; margin: .6rem 0 .25rem; }
    input, textarea, select, button { font: inherit; min-height: 44px; box-sizing: border-box; }
    input, textarea, select { width: 100%; border: 1px solid #bbc5d4; border-radius: .45rem; padding: .65rem; }
    button { border: 0; border-radius: .45rem; padding: .65rem 1rem; background: #2f5bea; color: white; cursor: pointer; }
    button.secondary { background: #687386; }
    button.complete { background: #16815b; }
    .grid { display: grid; gap: 1rem; grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr); }
    .task { display: flex; gap: .75rem; align-items: flex-start; border-top: 1px solid #e8ecf2; padding: .85rem 0; }
    .task:first-child { border-top: 0; }
    .task-title { flex: 1; }
    .task-title strong { display: block; }
    .muted { color: #687386; font-size: .9rem; }
    .overdue { color: #a33b35; font-weight: 650; }
    .empty { color: #687386; padding: 1rem 0; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header { flex-wrap: wrap; } nav { width: 100%; justify-content: space-between; } main { padding: 0 1rem; } .source-page { padding: 1.5rem 0 2rem; font-size: 1rem; } .source-context { margin-bottom: 1.5rem; } .markdown-body h1 { font-size: 1.75rem; } .markdown-body h2 { margin-top: 2rem; } .markdown-body h3 { margin-top: 1.5rem; } .markdown-body pre { padding: .75rem; } }
  </style>
</head>
<body>
<header>
  <a href="/">LifeOS</a>
  {% if username %}
  <nav><a href="/">Today</a><a href="/projects">Projects</a><a href="/areas">Areas</a><a href="/tasks">Tasks</a><a href="/goals">Goals</a><a href="/routines">Routines</a><a href="/data">Data</a><form class="inline" method="post" action="/ui/logout"><button class="secondary" type="submit">Log out</button></form></nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
