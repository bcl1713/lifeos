services:
  lifeos:
    build: .
    environment:
      LIFEOS_USERNAME: ${LIFEOS_USERNAME:?set LIFEOS_USERNAME}
      LIFEOS_PASSWORD: ${LIFEOS_PASSWORD:?set LIFEOS_PASSWORD}
      LIFEOS_AGENT_TOKEN: ${LIFEOS_AGENT_TOKEN:?set LIFEOS_AGENT_TOKEN}
      LIFEOS_SCHEDULER_ENABLED: ${LIFEOS_SCHEDULER_ENABLED:-1}
      LIFEOS_SCHEDULER_INTERVAL_SECONDS: ${LIFEOS_SCHEDULER_INTERVAL_SECONDS:-900}
      LIFEOS_CHECKBOX_REFRESH_INTERVAL_SECONDS: ${LIFEOS_CHECKBOX_REFRESH_INTERVAL_SECONDS:-900}
      LIFEOS_CHECKBOX_REFRESH_DEBOUNCE_SECONDS: ${LIFEOS_CHECKBOX_REFRESH_DEBOUNCE_SECONDS:-1}
      LIFEOS_CHECKBOX_WATCHER_ENABLED: ${LIFEOS_CHECKBOX_WATCHER_ENABLED:-0}
      LIFEOS_CHECKBOX_SCAN_EXCLUSIONS: ${LIFEOS_CHECKBOX_SCAN_EXCLUSIONS:-}
      LIFEOS_TIMEZONE: ${LIFEOS_TIMEZONE:-America/Chicago}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
